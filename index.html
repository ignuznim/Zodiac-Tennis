      text(T ? '위의 탭을 눌러 페이지를 넘겨요' : '← → 페이지 · H 또는 Esc 닫기', W / 2, top + 830, 21, CREAM, 'center', OUT, F_B);
    },
  },
  pause: {
    update(dt) {
      if (m.online) { playCore(dt); if (scene !== 'pause') return; }
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('KeyH')) openHelp(0);
      if (pressed('Backspace')) goHome();
    },
    draw() {
      drawMatch(); hot = []; OY = 0;
      ctx.fillStyle = 'rgba(59,51,64,0.6)'; ctx.fillRect(0, 0, W, H);
      const cy = Math.round(H / 2);
      rr(110, cy - 190, 500, 380, 26, 'rgba(255,248,231,0.97)', OUT, 4);
      text(m.online ? '잠깐!' : '일시정지', W / 2, cy - 130, 52, INK, 'center', null, F_T);
      text(m.online ? '온라인 경기는 멈추지 않아요' : '숨 한번 고르고 가요', W / 2, cy - 78, 24, '#c0605a', 'center', null, F_H);
      button('계속하기', 170, cy - 36, 380, 72, () => { scene = 'play'; }, { size: 30, fill: '#fff3c4' });
      button('홈으로', 170, cy + 58, 380, 72, goHome, { size: 28 });
      text('P 계속하기 · Backspace 홈으로 · H 도움말', W / 2, cy + 162, 20, '#7a6872', 'center', null, F_B);
    },
  },
  results: {
    update(dt) {
      state.t += dt;
      const guest = net && net.role === 'guest';
      if (guest) guestStep();
      if (pressed('Escape')) { goHome(); return; }
      if (pressed('Enter') && !guest) { if (net) onlineAgain(); else { reset(); scene = 'play'; } }
    },
    draw() {
      menuBegin();
      const sc = m.sc, w = sc.winner, me = w === view, guest = net && net.role === 'guest';
      text(me ? '승리!' : '패배', W / 2, LY.titleY + 8, 76, me ? CORAL : '#7f8fb5', 'center', OUT, F_T);
      const RR = rules(), fin = sc.sets[sc.sets.length - 1] || [0, 0];
      const reg = canRank(), py = LY.top + 36, pb = py + SZ().result;
      text(`${RR.ko} · ${NAME(w)} 승리 · ${RR.sets > 1 && !RR.matchTb ? `세트 ${sc.won[w]} – ${sc.won[1 - w]}` : `${fin[w]} – ${fin[1 - w]}`}`, W / 2, LY.top + 8, 28, INK, 'center', CREAM, F_H);
      panel(LY.m, py, LY.w, pb - py);
      const bh = 400, by = py + (pb - py - bh) / 2; // the block of scores and stats, centred in the panel
      for (let r = 0; r < 2; r++) {
        const i = r === 0 ? view : 1 - view, y = by + 24 + r * 66;
        ctx.lineWidth = 2.6; ctx.strokeStyle = OUT;
        drawAnimal(m.P[i].a, LY.m + 52, y + 26, 0.5, { front: true, accent: i === view ? CORAL : SKY, anim: i === w ? 'cheer' : 'sad', t: state.t });
        text(NAME(i), LY.m + 92, y, 28, INK, 'left', null, F_T);
        sc.sets.forEach((g, n) => text('' + g[i], 400 + n * 54, y, 33, g[i] > g[1 - i] ? INK : '#b3a4ac', 'center', null, F_N));
      }
      const S = m.stats, a = view, b = 1 - view, sy = by + 170;
      text(NAME(a), 180, sy, 22, CORAL, 'center', null, F_T); text(NAME(b), 540, sy, 22, '#3d9be0', 'center', null, F_T);
      [['딴 포인트', S.pts], ['스위트 스폿', S.sweet], ['파워샷', S.power], ['에이스', S.aces]].forEach((row, i) => { const y = sy + 44 + i * 40; text(row[0], W / 2, y, 21, '#7a6872', 'center', null, F_B); text('' + row[1][a], 180, y, 30, INK, 'center', null, F_N); text('' + row[1][b], 540, y, 30, INK, 'center', null, F_N); });
      text(`가장 긴 랠리  ${S.longest}번`, W / 2, sy + 44 + 4 * 40 + 6, 25, '#c0605a', 'center', null, F_H);
      if (reg) {
        const ry = pb + LY.gap;
        if (rank.sent === m) { rr(LY.m, ry, LY.w, 68, 18, 'rgba(255,248,231,0.92)', OUT); text(rank.msg, W / 2, ry + 34, 26, '#c0605a', 'center', null, F_H); }
        else button(rank.sending ? '등록하는 중…' : '랭킹에 기록 등록하기', LY.m, ry, LY.w, 68, openNick, { size: 28, fill: '#ffe1a8' });
      }
      sideBtn('홈으로', goHome);
      if (guest) text('방장이 다시 하기를 누르면 선수를 다시 골라요', 468, LY.bot + 34, 24, INK, 'center', CREAM, F_H);
      else mainBtn('다시 하기', () => { if (net) onlineAgain(); else { reset(); scene = 'play'; } });
      menuEnd(guest ? '' : 'Enter : 다시 하기 · Esc : 홈으로');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  scrollStep(STEP);
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  while (clicks.length) { drawFrame(); const h = hitTest(clicks.shift()); if (h && h.fn) h.fn(); } // drawn again first: the buttons are where this frame puts them
  scenes[scene].update(STEP);
  if (scene === 'play' || scene === 'pause' || scene === 'help' || scene === 'results') netSend();
  hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  hot = []; scenes[scene].draw();
  if (touchUI && !COVER && innerWidth > innerHeight * 1.1) { // a phone held sideways: the game is drawn for portrait
    rr(W / 2 - 210, H - 50, 420, 38, 19, 'rgba(59,51,64,0.88)', null);
    text('휴대폰을 세로로 돌리면 화면이 더 커져요', W / 2, H - 31, 19, CREAM, 'center', null, F_B);
  }
  canvas.style.cursor = hitTest(mouse) ? 'pointer' : 'default'; }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
initAuth();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
if (document.fonts) { // the fonts are files in assets/: ask for them, and draw again when they arrive
  ['Jua', 'Do Hyeon', 'Gowun Dodum', 'Gaegu'].forEach(f => document.fonts.load(`20px "${f}"`, '가0').catch(() => {}));
  document.fonts.ready.then(() => { if (params.get('manual') === '1') drawFrame(); });
}
</script>
