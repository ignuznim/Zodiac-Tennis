// ---- Online: browser to browser over a link. The host runs the match, the guest sends keys ----
let net = null; // { role, peer, conn, status, code, link, rin, msg, last }
function netClose() { if (net) { try { net.peer && net.peer.destroy(); } catch (e) { /* closing */ } } net = null; view = 0; setup.mode = 'cpu'; }
function loadPeer(cb) {
  if (window.Peer) return cb();
  const s = document.createElement('script'); s.src = 'vendor/peerjs.min.js'; s.onload = cb;
  s.onerror = () => { net.status = 'error'; net.msg = '연결 라이브러리를 불러오지 못했어요'; }; document.head.appendChild(s);
}
function netHost() {
  const al = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', r = new Uint32Array(6); crypto.getRandomValues(r);

  loadPeer(() => {
    if (!net) return;
    net.peer = new Peer('zodiac-tennis-' + code);
    net.peer.on('open', () => { if (net) net.status = 'waiting'; });
    net.peer.on('error', e => { if (net) { net.status = 'error'; net.msg = '연결 오류: ' + (e.type || e); } });
    net.peer.on('connection', c => {
      if (net.conn) { c.close(); return; }
      net.conn = c;
      c.on('data', d => { if (!net) return; if (d.t === 'hello') { setup.guestAnimal = d.animal; setup.mode = 'online'; net.status = 'playing'; reset(); scene = 'play'; } else if (d.t === 'i') net.rin = d; });
      c.on('close', () => netLost());
    });
  });
}
function netJoin(code) {
  net = { role: 'guest', status: 'opening', code, msg: '', peer: null, conn: null, snap: null, lastSent: '', tick: 0 };
  loadPeer(() => {
    if (!net) return;
    net.peer = new Peer();
    net.peer.on('error', e => { if (net) { net.status = 'error'; net.msg = e.type === 'peer-unavailable' ? '방을 찾을 수 없어요. 링크를 다시 확인해 주세요.' : '연결 오류: ' + (e.type || e); } });
    net.peer.on('open', () => {
      if (!net) return;
      net.status = 'connecting';
      const c = net.conn = net.peer.connect('zodiac-tennis-' + code.toUpperCase(), { serialization: 'json' });
      c.on('open', () => { net.status = 'joined'; c.send({ t: 'hello', animal: setup.animal }); });
      c.on('data', d => { if (net && d.t === 's') net.snap = d.m; });

}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  while (clicks.length) { drawFrame(); const h = hitTest(clicks.shift()); if (h && h.fn) h.fn(); } // drawn again first: the buttons are where this frame puts them
  scenes[scene].update(STEP);
  if (scene === 'play' || scene === 'pause' || scene === 'help' || scene === 'results') netSend();
  hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  hot = []; scenes[scene].draw();
  if (touchUI && !COVER && innerWidth > innerHeight * 1.1) { // a phone held sideways: the game is drawn for portrait
    rr(W / 2 - 210, H - 50, 420, 38, 19, 'rgba(59,51,64,0.88)', null);
    text('휴대폰을 세로로 돌리면 화면이 더 커져요', W / 2, H - 31, 19, CREAM, 'center', null, F_B);
  }
  canvas.style.cursor = hitTest(mouse) ? 'pointer' : 'default'; }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
